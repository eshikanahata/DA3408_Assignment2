version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=cache     
      - REDIS_PORT=6379
      - CACHE_TTL_SECONDS=300
    depends_on:
      - cache

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"          
